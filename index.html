<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>

<script>
    let dadosPlanilha = []; 
    let ultimoResultadoBusca = []; 

    // --- CONFIGURAÇÃO DO BANCO DE DADOS LOCAL (IndexedDB) ---
    const dbNome = "MeuBancoDeDados";
    const storeNome = "planilhas";

    function abrirDB() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open(dbNome, 1);
            request.onupgradeneeded = e => e.target.result.createObjectStore(storeNome);
            request.onsuccess = e => resolve(e.target.result);
            request.onerror = e => reject(e.target.error);
        });
    }

    async function salvarPlanilhaLocal(arquivoArrayBuffer) {
        const db = await abrirDB();
        const tx = db.transaction(storeNome, "readwrite");
        tx.objectStore(storeNome).put(arquivoArrayBuffer, "arquivo_atual");
    }

    async function carregarPlanilhaLocal() {
        const db = await abrirDB();
        const tx = db.transaction(storeNome, "readonly");
        const arquivo = await new Promise(resolve => {
            const req = tx.objectStore(storeNome).get("arquivo_atual");
            req.onsuccess = () => resolve(req.result);
        });

        if (arquivo) {
            processarDados(arquivo, true);
        }
    }

    // --- PROCESSAMENTO DOS DADOS ---
    function processarDados(arrayBuffer, ehCarregamentoAutomatico = false) {
        try {
            const data = new Uint8Array(arrayBuffer);
            const workbook = XLSX.read(data, { type: 'array' });
            const firstSheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[firstSheetName];
            
            dadosPlanilha = XLSX.utils.sheet_to_json(worksheet, { range: 5 });

            const statusMsg = ehCarregamentoAutomatico ? "✅ Dados carregados automaticamente da memória!" : "✅ Planilha carregada e salva com sucesso!";
            document.getElementById('statusArquivo').textContent = `${statusMsg} (${dadosPlanilha.length} linhas)`;
            
        } catch (error) {
            document.getElementById('statusArquivo').textContent = '❌ Erro ao processar o arquivo.';
            console.error(error);
        }
    }

    // Iniciar ao carregar a página
    window.addEventListener('DOMContentLoaded', carregarPlanilhaLocal);

    // Evento de Seleção de Arquivo
    document.getElementById('inputExcel').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        document.getElementById('statusArquivo').textContent = 'Processando e Salvando...';

        const reader = new FileReader();
        reader.onload = function(e) {
            const buffer = e.target.result;
            processarDados(buffer); // Processa para uso imediato
            salvarPlanilhaLocal(buffer); // Salva no navegador para a próxima vez
        };
        reader.readAsArrayBuffer(file);
    });

    // --- FUNÇÕES DE BUSCA (Mantidas do seu código original) ---
    function buscarDados() {
        const uf = document.getElementById('inputUF').value.trim().toUpperCase();
        const resultadoDiv = document.getElementById('resultado');

        if (dadosPlanilha.length === 0) {
            resultadoDiv.innerHTML = '<p class="erro">Por favor, carregue a planilha primeiro.</p>';
            return;
        }

        if (!uf) {
            resultadoDiv.innerHTML = '<p class="erro">Preencha o campo UF para pesquisar.</p>';
            return;
        }

        let resultadosFiltrados = dadosPlanilha.filter(linha => {
            const colunaUF = String(linha.UF || '').toUpperCase();
            return colunaUF === uf;
        });
        
        ultimoResultadoBusca = resultadosFiltrados.sort((a, b) => {
            const cidadeA = String(a.CIDADE || '').toLowerCase();
            const cidadeB = String(b.CIDADE || '').toLowerCase();
            return cidadeA.localeCompare(cidadeB, 'pt-BR');
        });

        if (ultimoResultadoBusca.length > 0) {
            let htmlResultado = `<h3>📍 ${ultimoResultadoBusca.length} Local(is) Encontrado(s) para ${uf}:</h3>`;
            htmlResultado += '<ul style="list-style-type: none; padding: 0;">';

            ultimoResultadoBusca.forEach((linha, index) => {
                const cidade = linha.CIDADE || 'N/A';
                const bairro = linha.BAIRRO || 'N/A'; 
                const siglaSK = linha['SIGLA SK'] || 'N/A'; 
                
                htmlResultado += `
                    <li style="margin-bottom: 15px; border: 1px solid #ddd; padding: 10px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center;">
                        <span>
                            <strong>Cidade:</strong> ${cidade}<br>
			    <strong>Bairro:</strong> ${bairro}<br>
                            <strong>Sigla SK:</strong> ${siglaSK}
                        </span>
                        <button onclick="mostrarDetalhes(${index})" style="background-color: #28a745; color: white; padding: 8px 12px; border: none; border-radius: 4px; cursor: pointer;">
                            Ver Detalhes
                        </button>
                    </li>
                `;
            });
            htmlResultado += '</ul>';
            resultadoDiv.innerHTML = htmlResultado;
        } else {
            resultadoDiv.innerHTML = `<p class="erro">Nenhum dado encontrado para UF: ${uf}.</p>`;
        }
    }

    function mostrarDetalhes(index) {
        const resultadoDiv = document.getElementById('resultado');
        const resultadoBusca = ultimoResultadoBusca[index];

        if (!resultadoBusca) {
            resultadoDiv.innerHTML = '<p class="erro">Erro ao carregar os detalhes.</p>';
            return;
        }
        
        const colunasSolicitadas = [
            'SIGLA SK', 'ENDEREÇO', 'BAIRRO', 'CEP', 'E-MAIL DA UNIDADE', 
            'TELEFONE DA UNIDADE', 'WHATSAPP UNIDADE', 'HORÁRIO DE ATENDIMENTO AO CLIENTE'
        ];

        let htmlDetalhes = `<h3>📋 Detalhes de ${resultadoBusca.CIDADE} (${resultadoBusca['SIGLA SK']}):</h3>`;
        htmlDetalhes += `<p><strong>UF:</strong> ${resultadoBusca.UF}</p>`;
        htmlDetalhes += `<p><strong>Cidade:</strong> ${resultadoBusca.CIDADE}</p>`; 
        htmlDetalhes += '<hr>';

        colunasSolicitadas.forEach(chave => {
            const valor = resultadoBusca[chave] || 'N/A'; 
            htmlDetalhes += `<p><strong>${chave}:</strong> ${valor}</p>`;
        });
        
        htmlDetalhes += '<button onclick="buscarDados()" style="background-color: #6c757d; color: white; padding: 10px 15px; border: none; cursor: pointer; border-radius: 4px; margin-top: 20px;">'
        htmlDetalhes += '← Voltar para a Lista'
        htmlDetalhes += '</button>';

        resultadoDiv.innerHTML = htmlDetalhes;
    }
</script>
